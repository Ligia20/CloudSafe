# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy CloudSafe to Azure

on:
  push:
    branches:
      - azure-deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Build frontend
        working-directory: ./cloud-safe
        run: |
          npm install
          npm run build

      - name: Copy frontend into backend
        run: |
          rm -rf ./server/public
          mkdir -p ./server/public
          cp -R ./cloud-safe/dist/. ./server/public/

      - name: Build backend
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./server

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2F5AA7C3A7F44B28BB57693BEEEC93DA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_843259DF790B4CFD83A417EFE61CC507 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C6407E0177D54DCD83ECFDF0A5830E2B }}

      - name: Deploy CloudSafe
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cloudsafe-api-dev'
          slot-name: 'Production'
          package: ./server
